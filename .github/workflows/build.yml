name: Build and release

# Every push and pull request builds the game for Windows and Linux.
# Pushing a tag like v0.2.0 also publishes a GitHub Release with the builds attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
          - name: Linux
            os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the game code parses
        shell: bash
        run: for f in src/*.js; do node --input-type=module --check < "$f" || { echo "Syntax error in $f"; exit 1; }; done

      - name: Use the tag as the version number
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: slagworks-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  web:
    name: Build (Web / Xbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the web version
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"; [[ "$GITHUB_REF" == refs/tags/v* ]] || VER=dev
          mkdir -p dist
          zip -r "dist/slagworks-${VER}-web.zip" index.html style.css manifest.webmanifest icon.svg sw.js src
      - uses: actions/upload-artifact@v4
        with:
          name: slagworks-Web
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l artifacts
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Slagworks $GITHUB_REF_NAME" \
            --generate-notes
